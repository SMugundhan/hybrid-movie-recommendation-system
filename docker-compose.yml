

services:
  redis:
    image: redis:7-alpine
    container_name: redis-server
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: recommendation-api
    ports:
      - "8001:8001"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TTL: 400
    depends_on:
      - redis
